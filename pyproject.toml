[project]
name = "kb-gateway"
version = "0.1.0"
description = "MCP knowledge base gateway for multi-agent development"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "lancedb>=0.17.0",
    "pyarrow>=16.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
# 仅在运行本地向量模型时安装；基础安装与纯线上模式不含机器学习依赖
local-models = [
    "sentence-transformers>=3.0.0",
]

[project.scripts]
kb-gateway = "kb_gateway.cli:main"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kb_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
